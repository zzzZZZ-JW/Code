[project]
name = "so-arm101-console"
version = "0.1.0"
description = "Local FastAPI and React console for SO-ARM101 leader/follower control."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115.0",
  "pydantic>=2.8.0",
  "pyserial>=3.5",
  "uvicorn[standard]>=0.32.0",
]

[project.optional-dependencies]
hardware = [
  "lerobot[feetech]>=0.5.1",
]

[dependency-groups]
dev = [
  "httpx>=0.27.0",
  "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-q"

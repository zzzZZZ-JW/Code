<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python 闯关挑战</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --pink: #ff6b9d;
    --blue: #4ecdc4;
    --yellow: #ffe66d;
    --purple: #a78bfa;
    --bg: #fef9ff;
    --card: #ffffff;
    --text: #2d2d3f;
    --correct: #22c55e;
    --wrong: #ef4444;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 10% 20%, rgba(255,107,157,0.08) 0%, transparent 50%),
      radial-gradient(circle at 90% 80%, rgba(78,205,196,0.08) 0%, transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(167,139,250,0.05) 0%, transparent 50%);
    min-height: 100vh;
    color: var(--text);
    overflow-x: hidden;
  }

  /* ===== 顶部进度条 ===== */
  .progress-bar {
    position: fixed; top: 0; left: 0; width: 100%; height: 6px;
    background: #e5e7eb; z-index: 100;
  }
  .progress-fill {
    height: 100%; background: linear-gradient(90deg, var(--pink), var(--purple));
    border-radius: 0 3px 3px 0; transition: width 0.5s ease;
  }

  /* ===== 头部 ===== */
  .header {
    text-align: center; padding: 24px 20px 8px;
  }
  .header h1 {
    font-size: 1.8rem; font-weight: 900;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header .subtitle {
    font-size: 0.9rem; color: #888; margin-top: 4px;
  }
  .score-display {
    display: flex; justify-content: center; gap: 24px; margin-top: 8px;
    font-size: 0.9rem; font-weight: 700;
  }
  .score-display span { display: flex; align-items: center; gap: 4px; }

  /* ===== 主卡片 ===== */
  .card-container {
    max-width: 960px; margin: 12px auto; padding: 0 20px;
  }
  .card {
    background: var(--card);
    border-radius: 20px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.06);
    padding: 24px 28px;
    position: relative;
    overflow: hidden;
    animation: cardIn 0.4s ease;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* 题目头部区域 */
  .question-header {
    display: flex; align-items: center; gap: 12px;
    margin-bottom: 12px;
  }
  .question-num {
    display: inline-block;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    color: #fff; font-weight: 900; font-size: 0.8rem;
    padding: 4px 14px; border-radius: 20px; flex-shrink: 0;
  }
  .background-story {
    background: #fdf6ff;
    border-left: 4px solid var(--purple);
    border-radius: 0 10px 10px 0;
    padding: 8px 14px;
    font-size: 1rem; color: #666;
    line-height: 1.5; flex: 1;
  }
  .background-story::before {
    content: "📖 "; font-size: 0.9rem;
  }

  .question-text {
    font-size: 1.3rem; font-weight: 700;
    line-height: 1.6; margin-bottom: 16px;
  }
  .question-text code {
    background: #f3f0ff; color: var(--purple);
    padding: 2px 6px; border-radius: 4px; font-size: 0.95em;
    font-family: 'Courier New', monospace;
  }

  /* ===== 并排选项 ===== */
  .options {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 14px;
  }
  .option-btn {
    display: flex; flex-direction: column; align-items: center;
    background: #fafafa;
    border: 2.5px solid #e8e8f0;
    border-radius: 16px;
    padding: 16px 16px 14px;
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: center;
    font-family: inherit;
    font-size: 1rem;
    color: var(--text);
    position: relative;
  }
  .option-btn:hover:not(:disabled) {
    border-color: var(--purple);
    background: #f8f4ff;
    transform: translateY(-3px);
    box-shadow: 0 6px 16px rgba(167,139,250,0.18);
  }
  .option-btn:active:not(:disabled) {
    transform: translateY(0);
  }
  .option-btn:disabled {
    cursor: default;
  }

  .option-icon {
    font-size: 2.4rem; margin-bottom: 6px; line-height: 1;
  }
  .option-label {
    font-weight: 700; font-size: 0.8rem; color: #999;
    margin-bottom: 8px;
  }
  .option-code {
    background: #2d2d3f; color: #e2e8f0;
    padding: 10px 14px; border-radius: 10px;
    font-family: 'Courier New', monospace;
    font-size: 0.95rem; line-height: 1.5;
    white-space: pre-wrap; text-align: left;
    width: 100%;
  }

  /* 选中状态 */
  .option-btn.correct {
    border-color: var(--correct);
    background: #f0fdf4;
    animation: pop 0.3s ease;
  }
  .option-btn.wrong {
    border-color: var(--wrong);
    background: #fef2f2;
    animation: shake 0.4s ease;
  }
  @keyframes pop {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.02); }
    100% { transform: scale(1); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25%      { transform: translateX(-6px); }
    75%      { transform: translateX(6px); }
  }

  .result-badge {
    position: absolute; top: 10px; right: 12px;
    font-size: 1.4rem;
    animation: badgeIn 0.3s ease;
  }
  @keyframes badgeIn {
    from { transform: scale(0) rotate(-30deg); opacity: 0; }
    to   { transform: scale(1) rotate(0deg); opacity: 1; }
  }

  /* ===== 解释区域 ===== */
  .explanation {
    margin-top: 16px;
    background: linear-gradient(135deg, #fdf6ff, #f0f7ff);
    border-radius: 14px;
    padding: 16px 18px;
    font-size: 1.05rem;
    line-height: 1.7;
    animation: fadeIn 0.4s ease;
    display: none;
  }
  .explanation.show { display: block; }
  .explanation code {
    background: #ede9fe; color: var(--purple);
    padding: 1px 5px; border-radius: 4px;
    font-family: 'Courier New', monospace; font-size: 0.9em;
  }
  .explanation::before {
    content: "💡 "; font-size: 1.1rem;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ===== 下一题按钮 ===== */
  .next-btn {
    display: none; margin: 16px auto 0;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    color: #fff; border: none; border-radius: 14px;
    padding: 12px 36px; font-size: 1rem; font-weight: 700;
    cursor: pointer; font-family: inherit;
    transition: all 0.2s ease;
    box-shadow: 0 4px 16px rgba(167,139,250,0.3);
  }
  .next-btn.show { display: block; }
  .next-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(167,139,250,0.4);
  }

  /* ===== 结算页面 ===== */
  .result-screen {
    display: none;
    text-align: center;
    padding: 40px 20px;
    animation: cardIn 0.5s ease;
  }
  .result-screen.show { display: block; }
  .result-screen .big-emoji { font-size: 5rem; margin-bottom: 16px; }
  .result-screen h2 {
    font-size: 1.8rem; font-weight: 900; margin-bottom: 8px;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .result-screen .final-score {
    font-size: 1.1rem; color: #666; margin-bottom: 24px;
  }
  .result-screen .stars { font-size: 2.5rem; margin-bottom: 24px; }
  .restart-btn {
    background: linear-gradient(135deg, var(--blue), var(--purple));
    color: #fff; border: none; border-radius: 14px;
    padding: 14px 36px; font-size: 1rem; font-weight: 700;
    cursor: pointer; font-family: inherit;
    transition: all 0.2s ease;
    box-shadow: 0 4px 16px rgba(78,205,196,0.3);
  }
  .restart-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(78,205,196,0.4);
  }

  /* ===== 浮动装饰 ===== */
  .deco {
    position: fixed; pointer-events: none; opacity: 0.12;
    font-size: 3rem; z-index: -1;
    animation: float 6s ease-in-out infinite;
  }
  .deco:nth-child(1) { top: 10%; left: 5%; animation-delay: 0s; }
  .deco:nth-child(2) { top: 30%; right: 8%; animation-delay: 1.5s; }
  .deco:nth-child(3) { bottom: 20%; left: 10%; animation-delay: 3s; }
  .deco:nth-child(4) { bottom: 10%; right: 5%; animation-delay: 4.5s; }
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-20px) rotate(5deg); }
  }

  /* ===== 加载页 ===== */
  .loading-screen {
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    min-height: 60vh; text-align: center;
  }
  .loading-screen .spinner {
    width: 48px; height: 48px;
    border: 4px solid #e8e8f0;
    border-top-color: var(--purple);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin-bottom: 16px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ===== 抽纸 SVG ===== */
  .tissue-svg {
    width: 48px; height: 48px;
  }
</style>
</head>
<body>

<!-- 浮动装饰 -->
<div class="deco">🐍</div>
<div class="deco">🗃️</div>
<div class="deco">🥕</div>
<div class="deco">✨</div>

<!-- 进度条 -->
<div class="progress-bar">
  <div class="progress-fill" id="progressFill" style="width: 0%"></div>
</div>

<!-- 头部 -->
<div class="header">
  <h1 id="topicTitle">Python 闯关挑战</h1>
  <div class="subtitle" id="topicSubtitle">加载中…</div>
  <div class="score-display">
    <span><svg class="tissue-svg" viewBox="0 0 64 64" style="width:20px;height:20px;vertical-align:middle"><rect x="8" y="18" width="48" height="32" rx="4" fill="#b8d4f0" stroke="#7ba3cc" stroke-width="2"/><rect x="12" y="22" width="40" height="24" rx="2" fill="#dceaf8"/><ellipse cx="32" cy="18" rx="10" ry="5" fill="#fff" stroke="#ccc" stroke-width="1.5"/><path d="M28 18 Q32 8 36 18" fill="#fff" stroke="#ccc" stroke-width="1.5"/></svg> 正确: <b id="correctCount">0</b></span>
    <span>🥕 错误: <b id="wrongCount">0</b></span>
  </div>
</div>

<!-- 加载页 -->
<div class="loading-screen" id="loadingScreen">
  <div class="spinner"></div>
  <div>正在加载题目…</div>
</div>

<!-- 游戏区域 -->
<div class="card-container" id="gameArea" style="display:none">
  <div class="card" id="questionCard">
    <div class="question-header">
      <div class="question-num" id="questionNum"></div>
      <div class="background-story" id="bgStory"></div>
    </div>
    <div class="question-text" id="questionText"></div>
    <div class="options">
      <button class="option-btn" id="btnTissue" onclick="choose('tissue')">
        <div class="option-icon">
          <svg class="tissue-svg" viewBox="0 0 64 64">
            <rect x="8" y="18" width="48" height="32" rx="4" fill="#b8d4f0" stroke="#7ba3cc" stroke-width="2"/>
            <rect x="12" y="22" width="40" height="24" rx="2" fill="#dceaf8"/>
            <ellipse cx="32" cy="18" rx="10" ry="5" fill="#fff" stroke="#ccc" stroke-width="1.5"/>
            <path d="M28 18 Q32 8 36 18" fill="#fff" stroke="#ccc" stroke-width="1.5"/>
          </svg>
        </div>
        <div class="option-label">纸巾</div>
        <div class="option-code" id="tissueCode"></div>
      </button>
      <button class="option-btn" id="btnCarrot" onclick="choose('carrot')">
        <div class="option-icon">🥕</div>
        <div class="option-label">萝卜</div>
        <div class="option-code" id="carrotCode"></div>
      </button>
    </div>
    <div class="explanation" id="explanation"></div>
    <button class="next-btn" id="nextBtn" onclick="nextQuestion()">下一题 →</button>
  </div>
</div>

<!-- 结算页面 -->
<div class="card-container">
  <div class="result-screen" id="resultScreen">
    <div class="big-emoji" id="resultEmoji">🎉</div>
    <h2 id="resultTitle">挑战完成！</h2>
    <div class="final-score" id="finalScore"></div>
    <div class="stars" id="stars"></div>
    <button class="restart-btn" onclick="restart()">再来一次 🔄</button>
    <br><br>
    <button class="restart-btn" onclick="goHome()" style="background: linear-gradient(135deg, #ff6b9d, #a78bfa);">返回选题 🏠</button>
  </div>
</div>

<script>
  let currentQuestions = [];
  let currentIndex = 0;
  let correctNum = 0;
  let wrongNum = 0;
  let answered = false;

  function getTopicFromURL() {
    const params = new URLSearchParams(window.location.search);
    return params.get("topic") || "string";
  }

  function loadQuestions() {
    const topic = getTopicFromURL();
    const script = document.createElement("script");
    script.src = topic + "/questions.js";
    script.onload = () => {
      currentQuestions = questions;
      document.getElementById("loadingScreen").style.display = "none";
      document.getElementById("gameArea").style.display = "block";
      updateTopicHeader(topic);
      showQuestion();
    };
    script.onerror = () => {
      document.querySelector(".loading-screen").innerHTML =
        '<div style="font-size:3rem;margin-bottom:16px">😢</div>' +
        '<div>找不到题目文件：<b>' + topic + '/questions.js</b></div>' +
        '<br><button class="restart-btn" onclick="goHome()">返回选题 🏠</button>';
    };
    document.body.appendChild(script);
  }

  function updateTopicHeader(topic) {
    const names = {
      "string": "字符串篇", "list": "列表篇", "dict": "字典篇",
      "loop": "循环篇", "function": "函数篇", "condition": "条件判断篇",
      "file": "文件操作篇", "class": "面向对象篇"
    };
    const title = names[topic] || topic;
    document.getElementById("topicTitle").textContent = "Python 闯关挑战 · " + title;
    document.getElementById("topicSubtitle").textContent =
      "共 " + currentQuestions.length + " 题 · 选纸巾还是萝卜？";
    document.title = "Python 闯关 · " + title;
  }

  function showQuestion() {
    answered = false;
    const q = currentQuestions[currentIndex];

    document.getElementById("questionNum").textContent =
      "第 " + (currentIndex + 1) + " / " + currentQuestions.length + " 题";
    document.getElementById("bgStory").textContent = q.background;
    document.getElementById("questionText").innerHTML = q.description;
    document.getElementById("tissueCode").textContent = q.tissue.code;
    document.getElementById("carrotCode").textContent = q.carrot.code;

    const btnT = document.getElementById("btnTissue");
    const btnC = document.getElementById("btnCarrot");
    btnT.className = "option-btn"; btnT.disabled = false;
    btnC.className = "option-btn"; btnC.disabled = false;
    btnT.querySelector(".result-badge")?.remove();
    btnC.querySelector(".result-badge")?.remove();

    document.getElementById("explanation").classList.remove("show");
    document.getElementById("nextBtn").classList.remove("show");

    const pct = (currentIndex / currentQuestions.length) * 100;
    document.getElementById("progressFill").style.width = pct + "%";

    const card = document.getElementById("questionCard");
    card.style.animation = "none";
    card.offsetHeight;
    card.style.animation = "cardIn 0.4s ease";
  }

  function choose(choice) {
    if (answered) return;
    answered = true;

    const q = currentQuestions[currentIndex];
    const isCorrect = choice === q.answer;

    const btnT = document.getElementById("btnTissue");
    const btnC = document.getElementById("btnCarrot");
    btnT.disabled = true;
    btnC.disabled = true;

    const correctBtn = q.answer === "tissue" ? btnT : btnC;
    correctBtn.classList.add("correct");
    addBadge(correctBtn, "✅");

    if (!isCorrect) {
      const chosenBtn = choice === "tissue" ? btnT : btnC;
      chosenBtn.classList.add("wrong");
      addBadge(chosenBtn, "❌");
      wrongNum++;
    } else {
      correctNum++;
    }

    document.getElementById("correctCount").textContent = correctNum;
    document.getElementById("wrongCount").textContent = wrongNum;

    const exp = document.getElementById("explanation");
    exp.innerHTML = '<span style="font-size:1.1rem">💡 </span>' + q.explanation;
    exp.classList.add("show");

    const nextBtn = document.getElementById("nextBtn");
    nextBtn.textContent = currentIndex < currentQuestions.length - 1 ? "下一题 →" : "查看结果 🎯";
    nextBtn.classList.add("show");
  }

  function addBadge(btn, emoji) {
    const badge = document.createElement("span");
    badge.className = "result-badge";
    badge.textContent = emoji;
    btn.appendChild(badge);
  }

  function nextQuestion() {
    currentIndex++;
    if (currentIndex >= currentQuestions.length) {
      showResult();
    } else {
      showQuestion();
    }
  }

  function showResult() {
    document.getElementById("gameArea").style.display = "none";
    document.getElementById("progressFill").style.width = "100%";

    const total = currentQuestions.length;
    const pct = Math.round((correctNum / total) * 100);

    let emoji, title, starCount;
    if (pct === 100)     { emoji = "🏆"; title = "满分通关！太厉害了！"; starCount = 5; }
    else if (pct >= 80)  { emoji = "🎉"; title = "非常棒！继续加油！"; starCount = 4; }
    else if (pct >= 60)  { emoji = "😊"; title = "还不错，再练练更好！"; starCount = 3; }
    else if (pct >= 40)  { emoji = "💪"; title = "加油，多复习一下！"; starCount = 2; }
    else                 { emoji = "📚"; title = "需要多多练习哦！"; starCount = 1; }

    document.getElementById("resultEmoji").textContent = emoji;
    document.getElementById("resultTitle").textContent = title;
    document.getElementById("finalScore").textContent =
      "答对 " + correctNum + " / " + total + " 题（正确率 " + pct + "%）";
    document.getElementById("stars").textContent =
      "⭐".repeat(starCount) + "☆".repeat(5 - starCount);
    document.getElementById("resultScreen").classList.add("show");
  }

  function restart() {
    currentIndex = 0; correctNum = 0; wrongNum = 0;
    document.getElementById("correctCount").textContent = 0;
    document.getElementById("wrongCount").textContent = 0;
    document.getElementById("resultScreen").classList.remove("show");
    document.getElementById("gameArea").style.display = "block";
    showQuestion();
  }

  function goHome() { window.location.href = "index.html"; }

  loadQuestions();
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python 闯关挑战 · 选题</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --pink: #ff6b9d;
    --blue: #4ecdc4;
    --yellow: #ffe66d;
    --purple: #a78bfa;
    --bg: #fef9ff;
    --card: #ffffff;
    --text: #2d2d3f;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    background-image:
      radial-gradient(circle at 10% 20%, rgba(255,107,157,0.08) 0%, transparent 50%),
      radial-gradient(circle at 90% 80%, rgba(78,205,196,0.08) 0%, transparent 50%),
      radial-gradient(circle at 50% 50%, rgba(167,139,250,0.05) 0%, transparent 50%);
    min-height: 100vh;
    color: var(--text);
  }

  /* 浮动装饰 */
  .deco {
    position: fixed; pointer-events: none; opacity: 0.1;
    font-size: 3rem; z-index: -1;
    animation: float 6s ease-in-out infinite;
  }
  .deco:nth-child(1) { top: 8%; left: 4%; animation-delay: 0s; }
  .deco:nth-child(2) { top: 25%; right: 6%; animation-delay: 1.5s; }
  .deco:nth-child(3) { bottom: 15%; left: 8%; animation-delay: 3s; }
  .deco:nth-child(4) { bottom: 8%; right: 4%; animation-delay: 4.5s; }
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(0deg); }
    50%      { transform: translateY(-20px) rotate(5deg); }
  }

  .header {
    text-align: center; padding: 50px 20px 20px;
  }
  .header h1 {
    font-size: 2.4rem; font-weight: 900;
    background: linear-gradient(135deg, var(--pink), var(--purple));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header .subtitle {
    font-size: 1rem; color: #888; margin-top: 8px;
  }
  .header .mascot {
    font-size: 4rem; margin-bottom: 10px;
    animation: bounce 2s ease-in-out infinite;
  }
  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50%      { transform: translateY(-12px); }
  }

  .topic-grid {
    max-width: 720px; margin: 30px auto; padding: 0 20px;
    display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 16px;
  }

  .topic-card {
    background: var(--card);
    border: 2.5px solid #e8e8f0;
    border-radius: 18px;
    padding: 24px 20px;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s ease;
    text-decoration: none;
    color: var(--text);
    display: block;
    position: relative;
    overflow: hidden;
  }
  .topic-card:hover {
    border-color: var(--purple);
    transform: translateY(-4px);
    box-shadow: 0 8px 24px rgba(167,139,250,0.18);
  }
  .topic-card .icon {
    font-size: 2.8rem; margin-bottom: 10px;
    display: block;
  }
  .topic-card .name {
    font-size: 1.1rem; font-weight: 700;
    margin-bottom: 4px;
  }
  .topic-card .desc {
    font-size: 0.8rem; color: #999;
  }
  .topic-card.disabled {
    opacity: 0.4; pointer-events: none;
  }
  .topic-card.disabled::after {
    content: "即将推出";
    position: absolute; top: 10px; right: -28px;
    background: #e5e7eb; color: #888;
    font-size: 0.65rem; font-weight: 700;
    padding: 3px 32px;
    transform: rotate(35deg);
  }

  .footer {
    text-align: center; padding: 40px 20px;
    font-size: 0.8rem; color: #bbb;
  }
</style>
</head>
<body>

<div class="deco">🐍</div>
<div class="deco">🗃️</div>
<div class="deco">🥕</div>
<div class="deco">✨</div>

<div class="header">
  <div class="mascot">🐍</div>
  <h1>Python 闯关挑战</h1>
  <div class="subtitle">选择一个主题，开始答题吧！纸巾 vs 🥕萝卜，你选哪个？</div>
</div>

<div class="topic-grid" id="topicGrid">
  <!-- JS 动态生成 -->
</div>

<div class="footer">
  Python 课堂互动小游戏 · 点击主题卡片开始挑战
</div>

<script>
  // ===== 主题配置 =====
  // 添加新主题时，只需在这里加一项，并创建对应的 questions.js 文件
  const topics = [
    { id: "string",    icon: "🔤", name: "字符串篇",   desc: "print、引号、方法调用", enabled: true },
    { id: "list",      icon: "📋", name: "列表篇",     desc: "索引、切片、增删改查", enabled: false },
    { id: "dict",      icon: "📖", name: "字典篇",     desc: "键值对、遍历、嵌套",   enabled: false },
    { id: "loop",      icon: "🔁", name: "循环篇",     desc: "for、while、break",    enabled: false },
    { id: "condition", icon: "🔀", name: "条件判断篇", desc: "if-elif-else、逻辑运算", enabled: false },
    { id: "function",  icon: "⚙️", name: "函数篇",     desc: "定义、参数、返回值",   enabled: false },
    { id: "file",      icon: "📁", name: "文件操作篇", desc: "读写、with、路径",     enabled: false },
    { id: "class",     icon: "🏗️", name: "面向对象篇", desc: "类、对象、继承",       enabled: false },
  ];

  // ===== 渲染主题卡片 =====
  const grid = document.getElementById("topicGrid");

  topics.forEach(t => {
    const a = document.createElement("a");
    a.className = "topic-card" + (t.enabled ? "" : " disabled");
    a.href = t.enabled ? ("game.html?topic=" + t.id) : "javascript:void(0)";
    a.innerHTML =
      '<span class="icon">' + t.icon + '</span>' +
      '<div class="name">' + t.name + '</div>' +
      '<div class="desc">' + t.desc + '</div>';
    grid.appendChild(a);
  });
</script>
</body>
</html>
